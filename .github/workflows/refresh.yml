name: Refresh WST data

on:
  # 每 2 小时快速追更一次（赛季进行期间，覆盖比赛时段）
  schedule:
    - cron: "0 */2 * * *"
    # 每周一 UTC 03:00 = 北京时间 11:00：跑一次全量（补抓 WST 新排定、之前从未抓过的场次）
    - cron: "0 3 * * 1"
  # 允许手动触发（Actions 页面点 Run workflow）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # data/raw/matches.json 有 36MB 且每次刷新都变，不入库（见 .gitignore）。
      # 快速追更需要它做基线，所以这里用 Actions 缓存跨运行传递上一次的抓取结果。
      - name: Restore raw matches cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: wst-raw-matches-
          restore-keys: |
            wst-raw-matches-

      # 注：脚本内部会自检 —— 缺 seasons/rankings/players 会先补齐，
      # 没有 matches 基线时自动降级为全量抓取，因此这里不需要再判断文件是否存在。
      - name: Fetch latest from WST
        run: |
          if [ "${{ github.event.schedule }}" = "0 3 * * 1" ]; then
            echo "== 每周全量刷新 =="
            bash refresh_live.sh --full
          else
            echo "== 常规刷新（有缓存基线则快速追更）=="
            bash refresh_live.sh
          fi

      # 注：refresh_live.sh 内部已调用 build_dashboard.py 重建看板
      - name: Sanity check
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("data/dashboard.json", encoding="utf-8"))
          m = len(d.get("matches", []))
          print("season:", d["meta"]["season"], "| matches:", m)
          if m < 200:
              print("!! 比赛数异常偏低，疑似抓取失败，放弃提交")
              sys.exit(1)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 页面实际加载的是 data/dashboard.js（window.SNOOKER_DATA）+ index.html 的缓存版本号，
          # 只提交 dashboard.json 的话线上页面不会有任何变化（曾经踩过的坑）。
          git add data/dashboard.json data/dashboard.js index.html
          if git diff --quiet --cached; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): auto refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi

      - name: Save raw matches cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: wst-raw-matches-${{ github.run_id }}
